# Jarvis config template. Copy to config.yaml and adjust.
# Both PCs use the same file: the server reads the server section, the client reads client.

server:
  host: 0.0.0.0
  port: 8765
  permissions_enabled: true # false temporarily opens all tools to everyone, including unknown voices
  audio_recording:
    enabled: false           # enable to save all request WAVs locally before recognition
    retention_days: 0        # 0 = never auto-delete by age
    max_gb: 0                # 0 = no archive size limit
    min_free_gb: 5           # stop new writes at this free-space reserve; never delete old files
  camera_request_recording:
    enabled: false           # save camera frames requested during conversations, even with no people
    retention_days: 0
    max_gb: 0
    min_free_gb: 5

  training_archive:
    enabled: false           # permanent per-date/per-person audio, transcripts, face and YOLO body crops
    path: data/training_archive
    min_free_gb: 5           # stop new writes at reserve; never delete retained material

  media:                    # room media retention under data/homes/<home_id>/media (ТЗ 4.6/F-304)
    media_ttl_days: 3       # frames and crops
    clip_ttl_days: 7        # short clips
    cleanup_interval_s: 3600  # F-304: how often the scheduler job expires media (0 = только при старте)

  vectors:                  # sqlite-vec search index over the stored embeddings (ТЗ 4.6)
    enabled: true
    extension_path: ""      # "" = auto: ROWAN_SQLITE_VEC_PATH -> sqlite_vec package -> hub/vendor/vec0.dll
    dimensions: {}          # optional per-kind override, e.g. {voice: 192, face: 512, memory: 384}

  outbound:                 # one send buffer per client, so a slow room cannot hold back the others (ТЗ 4.4/13)
    queue_capacity: 32      # background frames (camera state, HUD) are dropped first; replies/PCM never

  memory:                   # память v2: факты в таблице `memories`, топ-8 в промпт (ТЗ 9.4, F-414)
    retrieval_enabled: true # гибридный поиск (BM25 + вектор) перед каждым ответом
    top_k: 8                # сколько фактов попадает в промпт (ТЗ: топ-8)
    embedding_model: "models/multilingual-e5-small"  # или models/bge-m3; путь от корня репозитория
    allow_download: false   # true — разрешить загрузку модели по HF id (иначе только локальная папка)
    vector_weight: 0.5      # доля векторной половины в общей оценке (0 = только слова)
    bm25_k1: 1.5            # параметры BM25
    bm25_b: 0.75
    embed_on_remember: true # считать эмбеддинг факта сразу при «запомни» (нет модели — вектор не пишется)
    management_enabled: true  # явные «запомни, что …» / «забудь, что …» / «что ты обо мне знаешь?» (F-418)
    confirm_remember: false   # спрашивать «да» перед записью, которую задумал сам МОДЕЛЬ (явная просьба спрашивает всегда)
    confirm_forget: true      # «forget_fact» удаляет данные — спрашивать «да» (F-113)
    knowledge_max_facts: 10   # сколько фактов называет ответ «что ты обо мне знаешь?»
    dialogs_from_db: false  # true — история и recall читаются из `dialog_turns` (P3-17); jsonl-архив остаётся читаемой копией
    # Ночная консолидация памяти (F-416): в 04:00 по поясу ДОМА день
    # превращается в 5–10 фактов, дубли сливаются, старые факты теряют вес,
    # истёкшие удаляются, а недостающие векторы догоняются.
    consolidation_enabled: true
    consolidation_hour: 4         # час по местному времени дома
    consolidation_minute: 0
    consolidation_check_interval_s: 900 # как часто планировщик проверяет, чей дом уже «после 04:00»
    consolidation_window_hours: 24 # что считается «днём»
    consolidation_min_facts: 5     # ТЗ: день — это 5–10 фактов
    consolidation_max_facts: 10
    decay_per_day: 0.9             # какую долю веса факт сохраняет за сутки
    decay_floor: 0.05              # ниже этого живого факта вес не опускается
    duplicate_similarity: 0.93     # порог сходства эмбеддингов для слияния дублей
    fold_sources: true             # факт, вошедший в сводку дня, удаляется (его содержание в сводке)
    embed_batch: 256               # сколько недостающих векторов считать за проход

  reminders:                # напоминания: «напомни через 20 минут», «в пятницу в 9» (ТЗ F-417)
    enabled: true           # false — хаб не разбирает просьбы о напоминаниях вовсе
    default_hour: 9         # «напомни завтра» без времени — 9 утра по часам ДОМА (решение P3-21)
    max_pending_per_person: 100  # сколько ненаступивших напоминаний терпит один человек
    check_interval_s: 30    # как часто планировщик смотрит, не наступил ли срок (P3-22)
    due_batch: 50           # сколько наступивших напоминаний один проход отдаёт за раз

  rules:                    # правила и рутины: триггер → условия → действия (ТЗ F-419)
    enabled: true           # false — хаб не исполняет правила вовсе
    check_interval_s: 60    # как часто проверяются правила по времени (час дома, не хаба)
    voice_creation: true    # правило можно попросить голосом: «когда я приду после 22:00, включи тёплый свет»

  briefing:                 # утренний брифинг: «встал» или час дома (ТЗ F-420)
    enabled: false          # говорит сам, без приглашения: по умолчанию выключено
    time: "07:30"           # час дома, в который человек, уже вставший, слышит брифинг
    window_start: "05:00"   # раньше этого вход в комнату не считается «встал»
    window_end: "11:00"     # позже этого утреннего брифинга уже нет
    max_chars: 700          # сколько знаков терпит произнесённый брифинг
    check_interval_s: 60    # как часто планировщик проверяет, кому пора

  device_state:             # состояние устройств: БД, контекст LLM, «уже выключено» (ТЗ F-505)
    enabled: true           # false — повтор команды не проверяется
    stale_after_s: 900      # сколько секунд запись считается свежей для «уже так и есть»
    poll_interval_s: 0      # опрос адаптеров хаба, секунды; 0 — только отчёты комнаты

  stt:
    model: large-v3          # faster-whisper
    device: cuda
    compute_type: float16    # int8_float16: same accuracy, ~1.9 GB less VRAM (use it on a shared GPU)
    language: null           # null = auto-detect within allowed_languages; "en" pins English
    allowed_languages: [en, ru, es]   # auto-detect whitelist; [] = any language
    batch_size: 4            # ТЗ 4.4/15.1: utterances that arrive together are decoded in one call (2-4)
    batch_window_ms: 40      # how long to wait for a second utterance before decoding alone

  diarization:               # local multi-speaker mode; docs/MULTI_SPEAKER.md
    enabled: false          # enable after downloading Community-1
    reject_mixed_speech: true # false: attempt ordinary requests despite background voices; enrollment stays strict
    model_path: models/speaker-diarization-community-1
    device: cuda
    timeout_s: 45
    min_identity_s: 1.5      # minimum clean voice sample for a known identity

  image_generation:          # optional Nano Banana 2; docs/IMAGE_GENERATION.md
    enabled: false
    model: gemini-3.1-flash-image
    api_key_env: GEMINI_API_KEY # saved separately on the brain PC, never in YAML
    image_size: 1K
    timeout_s: 120

  telegram:                  # fixed-group messages/photos and optional @mentions; docs/TELEGRAM.md
    enabled: false
    chat_id: null             # fixed negative group ID; tools cannot choose another destination
    control_user_id: null     # ONLY this numeric sender gets tools in the group and their private DM
    # Extra accounts with the hub admin's own rights: they may open /tools,
    # control the rooms and receive notifications in private. The owner stays
    # the only account that cannot be removed. Groups the bot has been added to
    # become selectable notification destinations by themselves.
    admin_user_ids: []        # e.g. [8928749210, 6617808228]
    api_key_env: TELEGRAM_BOT_TOKEN # secret is saved on the brain PC, never in YAML
    timeout_s: 30
    respond_to_mentions: false # optional replies to new @bot mentions in this same group
    poll_timeout_s: 25

  llm:
    provider: ollama_native  # ollama_native (recommended: can disable thinking) | openai
    base_url: http://127.0.0.1:11434/v1   # /v1 is stripped automatically for ollama_native
    model: millard-qwen4:latest           # Qwen3.6-35B-A3B multimodal; tool calling + vision verified
    api_key: ollama
    api_key_env: OPENAI_API_KEY  # openai_responses only; never put the real key in YAML
    monthly_budget_usd: 18.0    # monthly app allowance; 0 = no ceiling (still counted)
    max_input_bytes: 64000      # an oversized cloud request is trimmed, never refused
    vision_base_url: null      # separate Ollama URL when chat uses OpenAI
    prompt_file: null          # cloud profile uses prompts/cloud.md
    think: false             # disable Qwen3 reasoning for fast voice replies
    vision_model: qwen2.5vl:7b        # fast NON-thinking vision model (coexists with the chat model)
    temperature: 0.3         # low keeps tool use disciplined (no claimed-but-not-done actions)
    max_tokens: 1024
    max_tool_rounds: 10      # tool-call rounds per utterance (a computer-use chain needs ~8)
    history_turns: 25        # latest exchanges for this person; older ones remain searchable
    keep_alive: 4h           # keep the CHAT model in VRAM (Ollama unloads after 5 m otherwise)
    vision_keep_alive: 10m   # the vision model holds ~8.4 GB; give it back when idle
    num_ctx: 16384           # system prompt + tool schemas alone are ~7.6k tokens; 8192 overflows

  speaker:                   # who is talking (ECAPA voice profiles, data/people.json)
    enabled: true
    threshold: 0.40          # conservative starting threshold; cosine score is not probability
    margin: 0.15             # winner must lead the runner-up by this
    admin_threshold: 0.65    # privileged actions and updating existing voice samples
    min_speech_s: 0.8        # shorter utterances are left unidentified

  face:                      # face recognition + presence (v1.4, insightface)
    enabled: true
    greetings_enabled: true   # false silences proactive greetings; tracking and appearance stay active
    appearance_enabled: true # retain validated face/body references locally; no automatic deletion
    adaptive_recognition: true # use up to 12 validated appearance vectors per enrolled person
    threshold: 0.45          # cosine similarity for a face to match a profile
    presence_ttl_s: 30       # forget someone this long after last seeing them
    greet_after_s: 0.35      # short stabilization before greeting an unknown face
    greeting_llm: false      # false = instant scripted greeting; true = ask the model (3-5 s slower)
    greeting_cooldown_s: 300       # greet the SAME stranger again after this long
    greeting_cooldown_known_s: 900 # greet the same KNOWN person again after this long
    burst_size: 3             # frames per multi-frame camera pull (v1.4 burst)
    enroll_bursts: 3          # background bursts enroll_face pulls after its first sample

  identity:                  # ТЗ F-203/F-206: голос + лицо + тело → один человек
    enabled: true
    reid:                    # OSNet: кроп тела → вектор 512-d в body_embeddings (F-203)
      enabled: true
      model: osnet_x1_0      # или osnet_ain_x1_0 — оба варианта из ТЗ
      threshold: 0.5         # cos тела ТОГО ЖЕ дня, чтобы связать трек с человеком (F-206)
      match_margin: 0.05     # победитель должен обойти второго человека на столько
      weights: ""            # пусто = предобученные веса torchreid; иначе путь к своим
    admin_voice_threshold: 0.65   # ТЗ F-208: голос для привилегированного действия
    admin_face_threshold: 0.55    # ...и лицо не ниже этого, ИЛИ тело того же дня
    phone_admin_threshold: 0.65   # по телефону — свой порог голоса...
    phone_pin_required: true      # ...плюс голосовой PIN (ТЗ F-208)
    pin_window_s: 20              # сколько ждём произнесённый PIN
    pin_max_failures: 3           # столько неверных попыток — и блокировка
    pin_lockout_s: 300            # на сколько секунд
    appearance_retention_days: 7  # ТЗ F-209: «внешность дня» живёт неделю
    guest:                   # ТЗ F-210: регистрация гостя — фраза, 5–10 кадров, тело дня
      enabled: true
      min_frames: 5          # «5–10 кадров с разных ракурсов»
      max_frames: 10
      min_voice_seconds: 3.0 # столько чистой речи нужно для вектора голоса гостя
      flow_ttl_s: 300        # незаконченная регистрация истекает
      confirm_ttl_s: 900     # и вопрос владельцу в Telegram (F-210: обязателен)
      grant_window_s: 1800   # ТЗ F-606: «разреши ему музыку» действует 30 минут, потом само исчезает
    learning:                # ТЗ F-211: дообучение профиля только при p ≥ 0,9 и без конфликта
      enabled: true
      min_p: 0.9             # сильнее порога «узнан» 0,8 из F-207
      face_max_vectors: 12   # «до 12 векторов» лица
      voice_max_vectors: 8   # «до 8 векторов» голоса
      body_per_day: 4        # тело — по дням, вчерашняя одежда не сегодняшняя
      conflict_similarity: 0.6
      duplicate_similarity: 0.98
    anti_spoofing:           # ТЗ F-214: экран/фотография перед камерой и challenge-слово
      face: true             # искать муар, отсутствие микродвижений и плоское движение
      model: ""              # путь к anti-spoof модели (insightface anti-spoof / MiniFASNet)
      require_model: false   # true — без модели ни один бёрст не считается живым
      window_frames: 8       # последние кадры трека = бёрст
      min_frames: 5          # меньше — «судить не о чем» (это не «живой»)
      moire_threshold: 0.35  # насколько спектр кадра похож на решётку экрана
      motion_min: 0.004      # ниже — лицо в бёрсте застыло
      planar_residual_max: 0.02  # движение объясняется одной плоскостью => фотография
      planar_motion_min: 0.02    # но судить о плоскости можно только если что-то сдвинулось
      challenge: on_missing_witness  # off | on_missing_witness | always (ТЗ F-214)
      challenge_window_s: 20        # сколько ждём случайное слово
      challenge_voice_threshold: 0.5  # ECAPA: тот же ли это голос

  segment:                   # SAM3 open-vocabulary object finder (v1.5, find_object tool)
    enabled: true
    checkpoint: third_party/sam3/server/model/sam3.pt   # resolved relative to the repo root
    confidence: 0.5           # SAM3 match threshold

  gpu_queue:                 # one priority queue for every heavy job (ТЗ 4.5)
    enabled: true             # false runs each job directly, for debugging
    max_concurrent: 2         # GPU jobs in flight across all rooms
    fair_share: 0.5           # cap for one room while another is waiting
    max_waiting: 256          # queued jobs before new ones are refused
    utterance_timeout_s: 300  # safety net: does the job never start/finish?
    face_timeout_s: 120
    background_timeout_s: 120

  timeouts:                  # per-stage budgets: a slow stage degrades, never silence (ТЗ 4.5/15.1)
    enabled: true             # false = only the GPU-queue timeouts above apply
    stt_ms: 700               # конец речи (VAD) → финальный транскрипт
    diarization_ms: 700       # то же окно для diarized-прохода; опоздал — ответ без diarization
    speaker_ms: 700           # идентификация голоса (ReID); опоздала — ответ без имени
    reply_ms: 20000           # предохранитель раунда модели: завис — отвечаем словами

  streaming_reply:           # стриминговый ответ: первое предложение звучит сразу (ТЗ F-101)
    enabled: true             # первое предложение уходит в синтез, пока пишется остальное
    first_audio_budget_ms: 1200  # конец речи → первый звук ответа (таблица 15.1)

  confirmations:             # опасные действия: устное «да» за 8 с, иначе отмена (ТЗ F-113)
    enabled: true
    window_s: 8               # сколько секунд ждём «да»; молчание или другой ответ — отмена
    tools: [run_command]      # инструменты целиком; read-only команды (dir, uptime, ...) не спрашивают
    pc_commands:              # pc_control, который может потерять работу
      [lock, sleep, suspend, hibernate, shutdown, power_off, reboot, restart, logoff, logout, close_app]

  decider:                   # кто отвечает на какой вопрос и сколько ему на это дано (ТЗ 5.2)
    timeout_ms: 400           # бюджет «транскрипт → начало генерации» из таблицы 15.1
    cache_ttl_s: 60           # ТЗ 5.4: одинаковый вопрос решается один раз в минуту (0 = без кэша)
    cache_max_entries: 256    # сколько ответов хранится
    report_days: 7            # ТЗ 5.4: окно недельного отчёта калибровки в админке
    # Провайдеры по типу решения, лучший первым. Тип, которого здесь нет,
    # остаётся со встроенной цепочкой (сейчас — rules).
    #   rules      — эвристики, всегда доступны, работают без GPU
    #   local_llm  — локальная модель (нужен openai-совместимый сервер, F-402)
    #   jev        — облачные типизированные решения TypeSafe (ТЗ 5.2/5.5).
    #                Он зовётся только там, где правила не отвечают: сам вызов
    #                идёт по сети и получает свой бюджет (timeout_ms ниже).
    order:
      route: [rules, jev]     # fast_command или запрос к модели
      model_level: [rules, jev]    # local_fast или local_strong (F-401)
      addressed: [rules, jev, local_llm]  # ТЗ 5.2: обращались ли к Rowan
      hallucination: [rules, jev]  # похож ли транскрипт на галлюцинацию Whisper
      # С включённым vLLM порядок можно перевести на модель, например:
      # route: [local_llm, rules]
      # Провайдеры, которых нет в работе (модель не загружена, Jev выключен),
      # цепочка пропускает молча — правила остаются базовым ответом.
    providers:                # ТЗ 5.2/5.5: облачный провайдер решений (Jev)
      jev:
        enabled: false        # ранний доступ TypeSafe: по умолчанию выключено
        base_url: ""          # https://api.typesafe.ai напрямую или https://openrouter.ai/api
        path: /v1/systemone   # System One API (так же, как в SDK typesafe-sdk)
        model: jev-latest     # сервер сам знает, какая версия Jev за именем
        timeout_ms: 1500      # бюджет одного облачного решения (сеть + модель)
        api_key_env: JEV_API_KEY  # ключ только в переменной окружения (раздел 1)

  skills:                    # скиллы: манифест + skill.py в своей папке (ТЗ F-405)
    dev_reload: false        # перечитывать скилл при изменении файла — только для разработки
    interval_s: 2            # как часто проверять файлы, секунды
    canvas:                  # Canvas LMS (ТЗ F-421): токен живёт в ОКРУЖЕНИИ, не здесь
      base_url: ""           # адрес школы, например https://school.instructure.com
      token_env: ROWAN_CANVAS_TOKEN        # имя переменной окружения с общим токеном
      person_tokens: {}      # у кого свой токен: person_id → имя переменной окружения
      timeout_s: 8           # таймаут одного запроса, секунды
      days: 7                # сколько дней вперёд считается «на этой неделе»
    calendar:                # Google Calendar (ТЗ F-421): по умолчанию выключен
      enabled: false         # доступ к календарю выдаёт владелец, а не обновление
      client_id_env: ROWAN_GOOGLE_CLIENT_ID        # имя переменной с client id
      client_secret_env: ROWAN_GOOGLE_CLIENT_SECRET  # имя переменной с client secret
      refresh_token_env: ROWAN_GOOGLE_REFRESH_TOKEN  # общий refresh-токен
      person_tokens: {}      # у кого свой календарь: person_id → имя переменной
      calendar_id: primary   # или адрес календаря
      timeout_s: 8           # таймаут одного запроса, секунды
      days: 1                # на сколько дней вперёд смотрит «первая встреча»

  web_admin:                 # веб-админка владельца (ТЗ F-705)
    # Панель живёт в приложении хаба, то есть отвечает на его порту
    # (server.port): /admin — дома, клиенты, люди, разметка; /admin/turns —
    # цепочка каждого запроса (голос и Telegram), включая промпты моделей.
    enabled: false           # включать только там, где есть overlay-сеть
    host: 127.0.0.1          # на стенде — адрес overlay-интерфейса
    port: 8099
    # По имени тоже строго: public-туннель (ngrok) приходит с loopback, но его
    # Host в этих сетях не лежит, и он получает 404.
    allowed_networks: [127.0.0.0/8, 100.64.0.0/10]  # Tailscale CGNAT + локально
    password_env: ROWAN_ADMIN_PASSWORD               # пароль только из окружения (ТЗ 15.4)
    session_minutes: 60

  presence:                  # присутствие дома (ТЗ F-301)
    enabled: true
    absence_s: 30.0          # сколько секунд без кадров — и человек считается вышедшим
    history_limit: 1000      # сколько событий дома читают вопросы «кто дома» и др.
    left_after_s: 600.0      # ТЗ F-507: никого 10 минут → сцена «ушёл» (по умолчанию)
    left_scene: "ушёл"       # какая сцена дома означает уход
    guard_enabled: true      # ставить дом в режим охраны, когда он опустел
    check_interval_s: 30.0   # как часто проверять, что дом опустел

  greeting:                  # приветствия и прощания (ТЗ F-302)
    enabled: true
    cooldown_s: 1200         # ТЗ: не чаще одного раза в 20 минут на человека
    quiet_start: ""          # «23:00» … «08:00» в местном времени дома; пусто = выключено
    quiet_end: ""
    farewell: true           # говорить «пока», когда человек вышел из комнаты

  intercom:                  # сообщения между комнатами (ТЗ F-601, F-603)
    enabled: true
    cooldown_s: 600.0        # ТЗ F-603: не чаще раза в 10 минут на человека
    max_messages: 1          # сколько сообщений человек может отправить за окно
    queue_limit: 50          # сколько невыданных сообщений хранит один дом
    check_interval_s: 30.0   # как часто проверять, не пришёл ли получатель

  push:                      # ТЗ F-712: пуш на телефон, когда человек не дома
    enabled: false           # транспорт включается только флагом с ключом
    provider: ""             # "" = нет транспорта; "webpush" (нужна pywebpush)
    key_env: ROWAN_PUSH_KEY  # секрет читается ТОЛЬКО из переменной окружения
    endpoint_env: ROWAN_PUSH_ENDPOINT   # адрес/тема провайдера, если он их требует
    title: Rowan             # заголовок уведомления на телефоне
    max_queue: 200           # сколько невыданных сообщений хранит один человек

  digest:                    # ТЗ F-704: ежедневный отчёт владельцу дома
    enabled: false           # отчёт говорит сам, без приглашения, поэтому выключен
    time: "21:00"            # время на часах ДОМА (у Чикаго и Киева оно разное)
    channel: telegram        # честно поддержан один канал — Telegram (ТЗ F-704)
    language: ru             # язык отчёта: владелец читает его сам
    history_limit: 5         # сколько примеров неудач показывать
    max_chars: 3000          # потолок одного сообщения
    check_interval_s: 300.0  # ровно один отчёт в день держит таблица digest_runs

  metrics:                   # ТЗ F-707: /metrics для Prometheus
    enabled: true            # endpoint виден там же, где /health; false отвечает 404

  objects:                   # ТЗ F-305: память объектов («где мои ключи?»)
    enabled: false           # индексация кадров — работа GPU и приватность: включает владелец
    interval_s: 600.0        # как часто индексировать кадр комнаты
    model: yolo11n.pt        # детектор объектов (ultralytics загружается лениво)
    confidence: 0.35         # ниже этого детектор не считает находку находкой
    max_objects: 50          # сколько объектов одного кадра записывать
    embed: true              # CLIP-вектор региона (open_clip ViT-B/32, лениво)
    embed_model: ViT-B/32    # модель эмбеддера; без пакета объект пишется без вектора

  ocr:                       # ТЗ F-308: OCR скриншота рядом с vision-моделью
    enabled: false           # ставится владельцем: модель OCR весит сотни мегабайт
    engine: rapidocr         # rapidocr | paddleocr (пакет грузится лениво)
    min_confidence: 0.5      # ниже этого строка не показывается: лучше «текста не видно»
    max_chars: 4000          # сколько знаков с экрана вообще отдавать
    max_lines: 200
    languages: [en]          # первый язык идёт в PaddleOCR как lang

  computer_use:              # ТЗ F-512: агент с мышью и клавиатурой
    enabled: false           # самая опасная функция: включается владельцем
    max_steps: 15            # предел самого ТЗ, выше поднять нельзя
    allowed_apps: []         # пустой список = агент не трогает ни одного приложения
    allow_typing: true       # пароли и платёжные данные запрещены всегда

  voice_clone:               # ТЗ F-111: клон голоса владельца
    enabled: false           # GPU-провайдер и согласие владельца обязательны
    provider: f5_tts         # f5_tts | chatterbox
    language: en
    model: ""                # пусто — модель по умолчанию провайдера
    cache_dir: data/voice_clone
    max_cache_entries: 200

  emotion:                   # ТЗ F-112: эмоция в голосе говорящего
    enabled: false           # GPU-классификатор занимает очередь: включает владелец
    model: models/emotion-wav2vec2-IEMOCAP   # локальные веса; HF id — только с allow_download
    device: cuda
    allow_download: false    # сеть по умолчанию выключена: веса кладёт владелец
    timeout_ms: 400          # опоздал — ход идёт без эмоции (стиль, не действие)
    min_confidence: 0.0      # ниже этого эмоция в контекст не попадает

  shared_events:             # ТЗ F-605: общий календарь группы
    enabled: true
    reminder_min_before: 10  # за сколько минут до начала напоминать
    check_interval_s: 60     # как часто задача проверяет календарь
    list_limit: 5            # сколько ближайших событий называть в ответе

  games:                     # ТЗ F-608: игры между комнатами (квиз и «кто сказал»)
    enabled: false           # вопросы пишет модель, поэтому флаг у владельца
    homes: []                # комнаты-участники; пусто — все комнаты хаба
    topics: ["история", "фильмы", "наука"]   # темы, которые можно назвать
    max_questions: 5         # сколько вопросов в партии
    answer_window_s: 45      # сколько секунд даётся на ответ
    points: 1                # сколько очков даёт верный ответ
    guess_window_s: 20       # «угадай, кто сказал»: секунд на догадки
    guess_points: 5          # очков самой быстрой комнате (остальным — меньше)

  tts:
    engine: silero
    language: en
    model_id: v3_en
    speaker: en_0            # en_0 .. en_117 (v3_en voices)
    kokoro_model_path: models/kokoro/kokoro-v1.0.onnx # engine=kokoro, speaker=am_michael for American male
    kokoro_voices_path: models/kokoro/voices-v1.0.bin
    sample_rate: 48000

# Model levels and the router that picks one (ТЗ F-401..F-403).
# OFF by default: while `enabled` is false every round uses `server.llm`
# above, exactly as before. An empty `model` means the level is not
# provisioned yet and the router skips it.
models:
  enabled: false
  levels:
    local_fast:                # small local model for commands and short replies
      provider: vllm
      base_url: http://127.0.0.1:8000/v1
      model: ""                # e.g. Qwen3-4B
      max_tokens: 512
    local_strong:              # the strong local model (Qwen 35B-A3B under vLLM)
      provider: vllm
      base_url: http://127.0.0.1:8000/v1
      model: ""
    local_vision:              # ТЗ F-404: one local multimodal level for screens and frames
      provider: ollama_native
      base_url: http://127.0.0.1:11434/v1
      model: qwen2.5vl:7b      # empty = images still go to server.llm.vision_model (logged)
    cloud_cheap:               # used only for the overflow of F-403
      provider: openai_responses
      model: gpt-5.4-mini
      api_key_env: OPENAI_API_KEY
    cloud_strong:
      provider: openai_responses
      model: gpt-5.4
      api_key_env: OPENAI_API_KEY
  routing:
    short_chars: 120           # at most this long may use local_fast
    strong_chars: 240          # from this length the strong level is used
    overflow_wait_s: 1.5       # F-403: class-0 predicted wait before overflow
    overflow_level: cloud_cheap
    cloud_fallback: false      # true = the owner allows spending on overflow
    vision_level: local_vision # F-404: which level looks at images
    cloud_vision: false        # F-404: send hard images to a cloud vision model
    vision_cloud_level: cloud_strong   # F-404: where a hard image goes when allowed

client:
  # Via ngrok (works from any network, including dorm Wi-Fi with client isolation):
  server_url: wss://dorm-smart-un-iversity-of-nebr-omaha.ngrok.app/ws
  # Direct LAN (faster, if the PCs can see each other):
  # server_url: ws://192.168.1.100:8765/ws   # IP of the 5090 PC
  client_id: livingroom
  workplace_name: Living room # Friendly name displayed in Telegram

  wakeword:
    word: rowan ai
    phrases: [rowan ai, rowan a i, roan ai, roan a i, rowen ai, rowen a i, rowanai]
    vosk_model: models/vosk-model-small-en-us-0.15

  audio:
    input_device: null       # null = default mic; or an index (3) or name part ("Yeti")
    output_device: null
    sample_rate: 16000       # do not change: Whisper/VAD/Vosk run at 16 kHz
    echo_cancellation: false # install client/requirements-audio.txt; Windows WASAPI reference
    noise_suppression: false # local WebRTC noise reduction before wake word, STT and voice ID
    noise_suppression_level: 1 # 0..3; avoid aggressive filtering for voice profiles

  vad:
    aggressiveness: 3        # 0..3, higher = cuts silence/noise harder (3 recommended for webcam mics)
    silence_ms: 700          # pause that ends an utterance
    max_utterance_s: 15
    pre_roll_ms: 300         # audio from BEFORE the trigger included in the recording
    min_speech_ms: 250       # shorter voiced bursts are noise blips - dropped, listening continues

  attention_mode: window     # ТЗ F-103: after a reply the microphone stays open without the wake word
  followup_window_s: 6       # ...for this long (Ф-103; maximum 30 s). wake_word = every turn needs the name
  thinking_sounds: true      # soft blips when a reply takes longer than ~1.5 s (vision, tool chains)

  camera:                    # room camera -> YOLO presence + face frames (v1.4)
    name: Main camera        # Friendly label; one camera per client
    enabled: true
    index: 0                 # OpenCV device index
    stream_url: null         # optional rtsp://camera-account:password@camera-ip:554/stream
    width: 1920              # USB capture request; use 3840 x 2160 for a 4K webcam
    height: 1080             # RTSP uses the resolution configured in the camera itself
    fps: 0                   # 0 = no software FPS cap; fresh frames only
    half: true               # CUDA FP16 inference
    frame_recording:
      enabled: false         # native-size JPEG of every YOLO-processed frame with a person
      retention_days: 0      # keep until manually deleted
      max_gb: 0
      min_free_gb: 5
    model: yolo11x.pt        # ultralytics model (auto-downloaded on first run)
    quick_model: yolo11n.pt  # light guard: first sign of a person between the heavy frames ("" = off)
    quick_fps: 8             # how often the guard may look; it reuses captured frames
    face_check_interval_s: 0.5 # one aligned face/tracking frame while someone is visible

  overlay:                 # sci-fi HUD on the TV (Tkinter, transparent, click-through)
    enabled: true
    position: bottom_right # orb corner: bottom_right | bottom_left | top_right | top_left | center
    idle_hidden: false     # true = hide the orb entirely when idle
    scale: 1.0             # orb size multiplier

  apps: {}                   # optional overrides: spoken name -> exe path.
                             # Any installed app is found automatically (Start Menu + Store apps);
                             # add entries only when the automatic match picks the wrong thing, e.g.:
                             # browser: "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"

  devices: []                # no physical devices yet. When they arrive, e.g.:
    # - name: led strip      # Magic Home Wi-Fi LED controller
    #   type: magichome
    #   area: room
    #   description: LED strip behind the TV
    #   restricted: true     # ТЗ F-606: гостю это устройство не выдаётся
    #   host: 192.168.1.50
    # - name: garland        # Tuya / Smart Life strip
    #   type: tuya
    #   area: room
    #   description: window garland
    #   dev_id: "xxxxxxxxxxxx"
    #   host: 192.168.1.51
    #   local_key: "yyyyyyyyyyyy"
    #   version: 3.3
    # - name: main light     # SwitchBot Bot pressing a wall switch
    #   type: switchbot_bot
    #   area: room
    #   description: main room light (button pusher on the wall switch)
    #   mac: "AA:BB:CC:DD:EE:FF"
    #   mode: press          # press | lever

