<!doctype html><html><head><meta charset="utf-8"><title>Rowan preview</title><style>body{margin:0;background:#0c0f14;overflow:hidden}iframe{border:0;width:100vw;height:100vh}</style></head><body><iframe title="Rowan chat" src="chat.html" onload="demo(this)"></iframe><button onclick="enroll()" style="position:fixed;top:12px;left:12px">Test enrollment wake word</button><script>
function demo(frame){const ui=frame.contentWindow;ui.hudState({state:'thinking'});ui.hudChat({person:'Anton',messages:[{ts:'2026-09-17T10:30:00',question:'Let’s find something to watch tonight.',answer:'You mentioned science and space. I’ll keep that in mind.'}],question:'Rowan, open that channel and find its latest video about Mars.'});ui.hudState({state:'thinking',status:'Opening the channel'});ui.hudState({state:'thinking',status:'Checking the latest uploads for videos about Mars'});}
function enroll(){const ui=document.querySelector('iframe').contentWindow;ui.hudReply({text:'Read the sentence on screen.',sentence:'Rowan, please remember how my normal voice sounds when I speak in this room.'});ui.hudFlash('wake');ui.hudState({state:'listening',status:'Reading your voice sample'});}
</script></body></html>
