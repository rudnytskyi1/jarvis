# Mosquitto для Rowan (ТЗ F-503). Секреты — в файле паролей, не в git.
listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/rowan.passwd
persistence true
persistence_location /var/lib/mosquitto/
# Устройства дома живут в своём префиксе: home/<home_id>/...
acl_file /etc/mosquitto/rowan.acl
log_dest file /var/log/mosquitto/mosquitto.log
